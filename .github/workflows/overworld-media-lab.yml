name: overworld-media-lab

on:
  push:
    branches: [lab/overworld-motion-atlas]
  pull_request:
    paths:
      - 'media-lab/overworld/**'
      - 'tools/**'
      - '.github/workflows/overworld-media-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify connector-transferred binary media
        run: python tools/verify_github_media.py
      - name: Build GIF and frame-strip artifacts
        run: python tools/remix_committed_media.py media-lab/overworld rebuilt
      - name: Inspect generated artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('rebuilt')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['webp_frames'] == 16
          assert manifest['atlas_scan_frames'] >= 6
          assert Image.open(root/'pikachu-turntable.gif').n_frames == 16
          assert Image.open(root/'directional-atlas-scan.gif').n_frames == manifest['atlas_scan_frames']
          print('generated', sorted(manifest['outputs']))
          PY
      - name: Upload generated animation lab
        uses: actions/upload-artifact@v4
        with:
          name: overworld-animation-lab-${{ github.run_id }}
          path: rebuilt/
          retention-days: 7
